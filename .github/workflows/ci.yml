name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'pytest.ini'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'pytest.ini'

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Cost optimization - use smaller runners when possible
  SMALL_RUNNER: ubuntu-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend Code Quality
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Cost optimization - prevent runaway jobs
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[quality]')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local/lib/python${{ env.PYTHON_VERSION }}/site-packages
        key: ${{ runner.os }}-pip-quality-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-quality-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy pylint bandit safety pip-audit
        # Install minimal requirements for linting
        pip install pydantic fastapi sqlalchemy

    - name: Check code formatting with Black
      run: black --check --diff backend/

    - name: Check import sorting with isort
      run: isort --check-only --diff backend/

    - name: Lint with flake8
      run: flake8 backend/ --statistics --tee --output-file=flake8-report.txt

    - name: Type checking with mypy
      run: mypy backend/ --install-types --non-interactive || true

    - name: Lint with pylint
      run: |
        pip install -r requirements.txt  # Install project deps for pylint
        pylint backend/ --exit-zero --output-format=text --reports=yes > pylint-report.txt

    - name: Security analysis with bandit
      run: bandit -r backend/ -f json -o bandit-report.json || true

    - name: Check for known security vulnerabilities (safety)
      run: safety check --json --output safety-report.json || true

    - name: Audit dependencies with pip-audit
      run: |
        pip install -r requirements.txt
        pip-audit --format json --output pip-audit-report.json || true

    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-quality-reports
        path: |
          flake8-report.txt
          pylint-report.txt
          bandit-report.json
          safety-report.json
          pip-audit-report.json
        retention-days: 30

  # Backend Security Scanning (runs on every commit)
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local/lib/python${{ env.PYTHON_VERSION }}/site-packages
        key: ${{ runner.os }}-pip-security-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-security-
          ${{ runner.os }}-pip-

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit bandit safety

    - name: Run pip-audit for vulnerability scanning
      run: |
        pip install -r requirements.txt
        pip-audit --desc --format json --output pip-audit.json
      continue-on-error: true

    - name: Run bandit for security issues
      run: |
        bandit -r backend/ -f json -o bandit.json -ll
      continue-on-error: true

    - name: Check Python dependencies for vulnerabilities
      run: |
        safety check --json --output safety.json
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-reports
        path: |
          pip-audit.json
          bandit.json
          safety.json
        retention-days: 90

    - name: Security scan summary
      if: always()
      run: |
        echo "### Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Security scanning completed. Check artifacts for detailed reports:" >> $GITHUB_STEP_SUMMARY
        echo "- pip-audit: Dependency vulnerability scan" >> $GITHUB_STEP_SUMMARY
        echo "- bandit: Code security analysis" >> $GITHUB_STEP_SUMMARY
        echo "- safety: Known vulnerability database check" >> $GITHUB_STEP_SUMMARY

  # Backend Testing and Quality Checks
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Cost optimization
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']  # Test multiple Python versions
        test-suite: ['unit', 'integration', 'security']  # Parallelize test types
      fail-fast: false  # Allow other tests to continue if one fails
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local/lib/python${{ matrix.python-version }}/site-packages
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Cache system dependencies
      id: cache-system-deps
      uses: actions/cache@v4
      with:
        path: /var/cache/apt
        key: ${{ runner.os }}-apt-${{ hashFiles('requirements.txt') }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client build-essential libpq-dev libxml2-dev libxslt1-dev libffi-dev

    - name: Install TA-Lib
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-xvfb  # For headless testing if needed

    - name: Set up test environment
      run: |
        cp .env.example .env || echo "No .env.example found"
        echo "DATABASE_URL=postgresql://postgres:testpass@localhost:5432/test_db" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "JWT_SECRET_KEY=test-secret-key" >> .env
        echo "APP_ENV=testing" >> .env

    - name: Initialize test database
      run: |
        # Wait for PostgreSQL to be ready
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        
        # Run database migrations
        alembic upgrade head || echo "No migrations to run"

    - name: Run backend tests with coverage
      continue-on-error: true
      run: |
        # Run different test suites based on matrix
        if [ "${{ matrix.test-suite }}" = "unit" ]; then
          pytest backend/tests/ \
            --cov=backend \
            --cov-report=xml:coverage-${{ matrix.test-suite }}-py${{ matrix.python-version }}.xml \
            --cov-report=html:htmlcov-${{ matrix.test-suite }}-py${{ matrix.python-version }} \
            --cov-report=term-missing \
            --junitxml=test-results-${{ matrix.test-suite }}-py${{ matrix.python-version }}.xml \
            -v -m "not slow" \
            --maxfail=5 \
            --tb=short \
            --ignore=backend/tests/integration/ \
            --ignore=backend/tests/security/ \
            --ignore=backend/tests/test_comprehensive_units.py \
            --ignore=backend/tests/test_integration_comprehensive.py \
            --ignore=backend/tests/test_financial_model_validation.py \
            --ignore=backend/tests/test_security_compliance.py \
            --ignore=backend/tests/test_performance_load.py
        elif [ "${{ matrix.test-suite }}" = "integration" ]; then
          pytest backend/tests/integration/ \
            --cov=backend \
            --cov-report=xml:coverage-${{ matrix.test-suite }}-py${{ matrix.python-version }}.xml \
            --cov-report=html:htmlcov-${{ matrix.test-suite }}-py${{ matrix.python-version }} \
            --cov-report=term-missing \
            --junitxml=test-results-${{ matrix.test-suite }}-py${{ matrix.python-version }}.xml \
            -v -m "not slow" \
            --maxfail=5 \
            --tb=short
        else
          pytest backend/tests/security/ \
            --cov=backend \
            --cov-report=xml:coverage-${{ matrix.test-suite }}-py${{ matrix.python-version }}.xml \
            --cov-report=html:htmlcov-${{ matrix.test-suite }}-py${{ matrix.python-version }} \
            --cov-report=term-missing \
            --junitxml=test-results-${{ matrix.test-suite }}-py${{ matrix.python-version }}.xml \
            -v -m "not slow" \
            --maxfail=5 \
            --tb=short
        fi
      env:
        DATABASE_URL: postgresql://postgres:testpass@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci
        JWT_SECRET_KEY: test-jwt-secret-key-for-ci
        MASTER_SECRET_KEY: test-master-secret-key-for-ci
        APP_ENV: testing

    - name: Check coverage target
      if: always()
      run: |
        if [ -f coverage-${{ matrix.test-suite }}-py${{ matrix.python-version }}.xml ]; then
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage-${{ matrix.test-suite }}-py${{ matrix.python-version }}.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0))
          print(f'{line_rate * 100:.1f}')
          ")
          echo "### Coverage: ${{ matrix.test-suite }} tests (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Line coverage | ${COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Python version | ${{ matrix.python-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test suite | ${{ matrix.test-suite }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Minimum threshold (fail) | 60% |" >> $GITHUB_STEP_SUMMARY
          echo "| Target threshold | 80% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Warn if below 80% target but above 60% minimum
          BELOW_TARGET=$(python -c "print('true' if float('${COVERAGE}') < 80.0 else 'false')")
          if [ "$BELOW_TARGET" = "true" ]; then
            echo "> **Warning:** Coverage is below the 80% target. Please add tests to improve coverage." >> $GITHUB_STEP_SUMMARY
          else
            echo "> Coverage meets the 80% target." >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.12'  # Upload all test suites for Python 3.12
      with:
        file: ./coverage-${{ matrix.test-suite }}-py${{ matrix.python-version }}.xml
        flags: backend,${{ matrix.test-suite }}
        name: backend-coverage-${{ matrix.test-suite }}-py${{ matrix.python-version }}
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Store test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results-py${{ matrix.python-version }}-${{ matrix.test-suite }}
        path: |
          test-results-${{ matrix.test-suite }}-py${{ matrix.python-version }}.xml
          coverage-${{ matrix.test-suite }}-py${{ matrix.python-version }}.xml
        retention-days: 30

    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-coverage-html-py${{ matrix.python-version }}-${{ matrix.test-suite }}
        path: htmlcov-${{ matrix.test-suite }}-py${{ matrix.python-version }}/
        retention-days: 30

  # Frontend Testing
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Cost optimization
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/web/package-lock.json

    - name: Install dependencies
      working-directory: frontend/web
      run: npm ci

    - name: Run frontend tests
      continue-on-error: true
      working-directory: frontend/web
      run: |
        npm test -- --coverage --run --reporter=verbose
      env:
        CI: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-results
        path: |
          frontend/web/coverage/
          frontend/web/test-results/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./frontend/web/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Frontend Code Quality
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Cost optimization
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/web/package-lock.json

    - name: Install dependencies
      working-directory: frontend/web
      run: npm ci

    - name: Run ESLint
      working-directory: frontend/web
      run: |
        npm run lint -- --format=json --output-file=eslint-report.json || true

    - name: Check formatting with Prettier
      working-directory: frontend/web
      run: |
        npx prettier --check src/**/*.{js,jsx,ts,tsx,css,scss} || true

    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-quality-reports
        path: frontend/web/eslint-report.json

  # Docker Build Test
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Cost optimization
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docker-build'))  # Only build on push or specific PR label
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.backend
        push: false
        tags: test-backend:latest
        cache-from: type=gha,scope=backend-ci
        cache-to: type=gha,mode=max,scope=backend-ci
        platforms: linux/amd64  # Build only for current platform to save time

    - name: Build frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.frontend
        push: false
        tags: test-frontend:latest
        cache-from: type=gha,scope=frontend-ci
        cache-to: type=gha,mode=max,scope=frontend-ci
        platforms: linux/amd64  # Build only for current platform to save time

    # Removed local cache management - using GitHub Actions cache instead

  # Integration Tests
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Cost optimization
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Only run on main branch pushes
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create test environment file
      run: |
        cat << EOF > .env
        DATABASE_URL=postgresql://postgres:testpass@postgres:5432/investment_db
        REDIS_URL=redis://redis:6379/0
        JWT_SECRET_KEY=test-secret-key-for-integration
        APP_ENV=testing
        DEBUG=True
        TEST_DB_PASSWORD=testpass
        TEST_JWT_SECRET_KEY=test-secret-key-for-integration
        ALPHA_VANTAGE_API_KEY=demo
        FINNHUB_API_KEY=demo
        POLYGON_API_KEY=demo
        NEWS_API_KEY=demo
        EOF

    - name: Run integration tests
      run: |
        docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from backend
        docker compose -f docker-compose.test.yml down -v

    - name: Collect integration test results
      if: always()
      run: |
        mkdir -p integration-results
        docker compose -f docker-compose.test.yml logs backend > integration-results/backend-logs.txt 2>&1 || true

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: integration-results/

  # Notification on failure
  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Cost optimization
    needs: [backend-test, backend-security, backend-quality, frontend-test, frontend-quality, docker-build, integration-test]
    if: failure() && github.event_name == 'push'  # Only notify on push failures
    
    steps:
    - name: Notify on Slack
      uses: 8398a7/action-slack@v3
      if: env.SLACK_WEBHOOK_URL != ''
      with:
        status: failure
        text: 'CI Pipeline failed for ${{ github.repository }} on branch ${{ github.ref_name }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Send email notification
      if: env.EMAIL_ENABLED == 'true'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "CI Pipeline Failed: ${{ github.repository }}"
        body: |
          The CI pipeline failed for repository ${{ github.repository }}.
          
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          Please check the GitHub Actions for more details.
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: ${{ secrets.SMTP_USERNAME }}
      env:
        EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}

  # Summary
  ci-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Cost optimization
    needs: [backend-test, backend-security, backend-quality, frontend-test, frontend-quality, docker-build, integration-test]
    if: always()
    
    steps:
    - name: CI Summary
      run: |
        echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Backend Tests | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Backend Security | ${{ needs.backend-security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Backend Quality | ${{ needs.backend-quality.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend Tests | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend Quality | ${{ needs.frontend-quality.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | ${{ needs.integration-test.result }} |" >> $GITHUB_STEP_SUMMARY

  # Sync boards after CI completion
  sync-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-test, backend-security, backend-quality, frontend-test, frontend-quality, docker-build, integration-test]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
      pull-requests: write
      contents: read
      repository-projects: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Sync GitHub Projects Board
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        REPO_OWNER="${GITHUB_REPOSITORY_OWNER}"

        # Find project
        PROJECT_ID=$(gh project list --owner "$REPO_OWNER" --format json 2>/dev/null | \
          jq -r '.projects[] | select(.title | contains("Investment Analysis")) | .id' | head -1 || echo "")

        if [[ -z "$PROJECT_ID" || "$PROJECT_ID" == "null" ]]; then
          echo "Project not found, skipping board sync"
          exit 0
        fi

        echo "Syncing open issues to project board..."

        # Add all open issues
        gh issue list --repo "$GITHUB_REPOSITORY" --state open --json url --limit 50 | \
          jq -r '.[].url' | while read -r url; do
          gh project item-add "$PROJECT_ID" --owner "$REPO_OWNER" --url "$url" 2>/dev/null || true
        done

        # Add all open PRs
        gh pr list --repo "$GITHUB_REPOSITORY" --state open --json url --limit 20 | \
          jq -r '.[].url' | while read -r url; do
          gh project item-add "$PROJECT_ID" --owner "$REPO_OWNER" --url "$url" 2>/dev/null || true
        done

        echo "Board sync complete"

    - name: Trigger Notion Sync
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Trigger the dedicated Notion-GitHub sync workflow
        gh workflow run notion-github-sync.yml \
          --field direction=github_to_notion \
          --field conflict_resolution=github_wins 2>/dev/null || \
          echo "Could not trigger Notion sync (workflow may not exist)"

    - name: Update Summary
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Board Sync" >> $GITHUB_STEP_SUMMARY
        echo "Project boards synchronized after CI completion." >> $GITHUB_STEP_SUMMARY