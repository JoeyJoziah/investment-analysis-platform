name: Comprehensive Testing Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run comprehensive tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  POSTGRES_PASSWORD: test_password
  REDIS_PASSWORD: test_redis_password

jobs:
  # Security and vulnerability scanning
  security-scan:
    runs-on: ubuntu-latest
    name: Security & Vulnerability Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install TA-Lib C library
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/ && ./configure --prefix=/usr && make && sudo make install
          cd .. && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install security scanning tools
        run: |
          pip install safety bandit semgrep
          npm install -g audit-ci

      - name: Run safety check for Python dependencies
        run: |
          pip install -r requirements.txt
          safety check --json --output safety-report.json || true

      - name: Run bandit security analysis
        run: |
          bandit -r backend/ -f json -o bandit-report.json || true

      - name: Run semgrep security analysis
        run: |
          semgrep --config=auto backend/ --json --output=semgrep-report.json || true

      - name: Frontend security audit
        run: |
          cd frontend/web
          npm install
          npm audit --audit-level high || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            safety-report.json
            bandit-report.json
            semgrep-report.json

  # Code quality and linting
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality & Linting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install TA-Lib C library
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/ && ./configure --prefix=/usr && make && sudo make install
          cd .. && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8 mypy pylint

      - name: Format check with Black
        continue-on-error: true
        run: |
          black --check --diff --exclude 'TradingAgents/' backend/

      - name: Import sorting check with isort
        continue-on-error: true
        run: |
          isort --check-only --diff --skip-glob 'backend/TradingAgents/*' backend/

      - name: Lint with flake8
        continue-on-error: true
        run: |
          flake8 backend/ --max-line-length=88 --extend-ignore=E203,W503 --exclude=backend/TradingAgents

      - name: Type checking with mypy
        run: |
          mypy backend/ --ignore-missing-imports --no-strict-optional --exclude 'TradingAgents/' || true

      - name: Advanced linting with pylint
        run: |
          pylint backend/ --disable=C0114,C0115,C0116 --ignore=TradingAgents || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: |
          cd frontend/web
          npm install

      - name: Lint frontend code
        run: |
          cd frontend/web
          npm run lint

      - name: Check frontend formatting
        run: |
          cd frontend/web
          npm run format:check

  # Unit tests with coverage
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests & Coverage
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: test_investment_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install TA-Lib C library
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/ && ./configure --prefix=/usr && make && sudo make install
          cd .. && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock coverage

      - name: Set up test environment
        run: |
          cp .env.example .env.test
          echo "DATABASE_URL=postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/test_investment_db" >> .env.test
          echo "REDIS_URL=redis://localhost:6379/0" >> .env.test

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/test_investment_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci
          MASTER_SECRET_KEY: test-master-secret-key-for-ci
        run: |
          pytest backend/tests/test_comprehensive_units.py \
            --cov=backend \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v

      - name: Check coverage target
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0))
          print(f'{line_rate * 100:.1f}')
          ")
            echo "### Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Line coverage | ${COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Minimum threshold (fail) | 60% |" >> $GITHUB_STEP_SUMMARY
            echo "| Target threshold | 80% |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            BELOW_TARGET=$(python -c "print('true' if float('${COVERAGE}') < 80.0 else 'false')")
            if [ "$BELOW_TARGET" = "true" ]; then
              echo "> **Warning:** Coverage is below the 80% target." >> $GITHUB_STEP_SUMMARY
            else
              echo "> Coverage meets the 80% target." >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/

  # Integration tests
  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: test_investment_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install TA-Lib C library
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/ && ./configure --prefix=/usr && make && sudo make install
          cd .. && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio testcontainers

      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/test_investment_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci
          MASTER_SECRET_KEY: test-master-secret-key-for-ci
        run: |
          pytest backend/tests/test_integration_comprehensive.py \
            -v \
            --tb=short \
            -m "not slow"

      - name: Upload integration test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: |
            pytest-report.html
            integration-test-logs/

  # Performance tests
  performance-tests:
    runs-on: ubuntu-latest
    name: Performance & Load Tests
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[run-performance-tests]')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: test_investment_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install TA-Lib C library
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/ && ./configure --prefix=/usr && make && sudo make install
          cd .. && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio psutil memory-profiler

      - name: Run performance tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/test_investment_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci
          MASTER_SECRET_KEY: test-master-secret-key-for-ci
        run: |
          pytest backend/tests/test_performance_load.py \
            -v \
            -m "performance" \
            --tb=short \
            --durations=0

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: |
            performance-metrics.json
            memory-profiles/

  # Financial model validation
  financial-model-tests:
    runs-on: ubuntu-latest
    name: Financial Model Validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install TA-Lib C library
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/ && ./configure --prefix=/usr && make && sudo make install
          cd .. && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest numpy pandas scikit-learn yfinance

      - name: Run financial model validation tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci
          MASTER_SECRET_KEY: test-master-secret-key-for-ci
          DATABASE_URL: sqlite:///test.db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest backend/tests/test_financial_model_validation.py \
            -v \
            --tb=short

      - name: Upload model validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-model-reports
          path: |
            model-validation-results.json
            backtesting-reports/

  # Security and compliance tests
  security-compliance-tests:
    runs-on: ubuntu-latest
    name: Security & Compliance Tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: test_investment_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install TA-Lib C library
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/ && ./configure --prefix=/usr && make && sudo make install
          cd .. && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio cryptography pyjwt

      - name: Run security and compliance tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/test_investment_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci
          MASTER_SECRET_KEY: test-master-secret-key-for-ci
        run: |
          pytest backend/tests/test_security_compliance.py \
            -v \
            --tb=short

      - name: Upload security test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-reports
          path: |
            security-test-results.json
            compliance-audit-logs/

  # Frontend tests
  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend/web
          npm install

      - name: Run frontend unit tests
        continue-on-error: true
        run: |
          cd frontend/web
          npm test -- --coverage --run

      - name: Run frontend E2E tests
        continue-on-error: true
        run: |
          cd frontend/web
          npm run test:e2e || echo "E2E tests skipped (Cypress not configured)"

      - name: Upload frontend test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: |
            frontend/web/coverage/
            frontend/web/cypress/screenshots/
            frontend/web/cypress/videos/

  # Docker build and test
  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build & Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare build context
        run: mkdir -p models

      - name: Build backend Docker image
        continue-on-error: true
        run: |
          docker build -f Dockerfile.backend -t investment-app-backend:test .

      - name: Build frontend Docker image
        continue-on-error: true
        run: |
          docker build -f Dockerfile.frontend -t investment-app-frontend:test .

      - name: Test Docker containers
        continue-on-error: true
        run: |
          # Start services
          docker-compose -f docker-compose.test.yml up -d

          # Wait for services to be ready
          sleep 30

          # Run health checks
          docker-compose -f docker-compose.test.yml exec -T backend python -c "
          import requests
          response = requests.get('http://localhost:8000/api/health')
          assert response.status_code == 200
          print('Backend health check passed')
          "

          # Stop services
          docker-compose -f docker-compose.test.yml down

      - name: Run security scan on Docker images
        continue-on-error: true
        run: |
          # Install trivy
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy

          # Scan images
          trivy image --exit-code 0 --format json -o backend-security-scan.json investment-app-backend:test
          trivy image --exit-code 0 --format json -o frontend-security-scan.json investment-app-frontend:test

      - name: Upload Docker security reports
        uses: actions/upload-artifact@v4
        with:
          name: docker-security-reports
          path: |
            backend-security-scan.json
            frontend-security-scan.json

  # End-to-end testing
  e2e-tests:
    runs-on: ubuntu-latest
    name: End-to-End Tests
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start full application stack
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.test.yml up -d
          
          # Wait for all services to be ready
          sleep 60

      - name: Set up Node.js for E2E tests
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install E2E test dependencies
        run: |
          npm install -g cypress @cypress/browserstack-plugin

      - name: Run E2E tests
        run: |
          cd frontend/web
          npm run cypress:run

      - name: Stop application stack
        if: always()
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.test.yml down

      - name: Upload E2E test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-reports
          path: |
            frontend/web/cypress/screenshots/
            frontend/web/cypress/videos/
            frontend/web/cypress/reports/

  # Generate comprehensive test report
  test-report:
    runs-on: ubuntu-latest
    name: Generate Test Report
    needs: [security-scan, code-quality, unit-tests, integration-tests, financial-model-tests, security-compliance-tests, frontend-tests]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Set up Python for report generation
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate comprehensive test report
        continue-on-error: true
        run: |
          if [ -f scripts/generate_test_report.py ]; then
            python scripts/generate_test_report.py \
              --security-reports security-reports/ \
              --coverage-reports coverage-reports/ \
              --integration-reports integration-test-reports/ \
              --performance-reports performance-reports/ \
              --frontend-reports frontend-test-reports/ \
              --output comprehensive-test-report.html
          else
            echo "Report generator not found, generating summary instead"
            echo '{"overall_status": "see individual job results"}' > test-summary.json
          fi

      - name: Upload comprehensive test report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-test-report
          path: |
            comprehensive-test-report.html
            test-summary.json

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            // Read test summary
            const testSummary = JSON.parse(fs.readFileSync('test-summary.json', 'utf8'));
            
            const comment = `
            ## 📊 Comprehensive Test Results
            
            | Test Suite | Status | Details |
            |------------|--------|---------|
            | Unit Tests | ${testSummary.unit_tests.status} | Coverage: ${testSummary.unit_tests.coverage}% |
            | Integration Tests | ${testSummary.integration_tests.status} | ${testSummary.integration_tests.tests_run} tests |
            | Security Tests | ${testSummary.security_tests.status} | ${testSummary.security_tests.vulnerabilities_found} vulnerabilities |
            | Performance Tests | ${testSummary.performance_tests.status} | Avg response: ${testSummary.performance_tests.avg_response_time}ms |
            | Frontend Tests | ${testSummary.frontend_tests.status} | ${testSummary.frontend_tests.tests_passed}/${testSummary.frontend_tests.total_tests} passed |
            
            **Overall Status:** ${testSummary.overall_status}
            
            📁 [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Deploy to staging (on main branch)
  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: [unit-tests, integration-tests, security-compliance-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.investment-app.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging..."
          # Actual deployment commands would go here

      - name: Run staging smoke tests
        run: |
          echo "Running staging smoke tests..."
          # Smoke test commands would go here

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Staging deployment successful"

  # Performance monitoring
  performance-monitoring:
    runs-on: ubuntu-latest
    name: Performance Monitoring
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Run performance benchmarks
        run: |
          echo "Running performance benchmarks against staging..."
          # Performance monitoring commands would go here

      - name: Update performance baselines
        run: |
          echo "Updating performance baselines..."
          # Update performance baseline metrics