name: Staging Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - qa

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build and push Docker images
  build-images:
    runs-on: ubuntu-latest
    outputs:
      # Single primary tag for Trivy/SBOM/deploy (multi-line tags break image-ref parsers)
      backend-image: ${{ steps.primary-images.outputs.backend }}
      frontend-image: ${{ steps.primary-images.outputs.frontend }}
      backend-digest: ${{ steps.backend-build.outputs.digest }}
      frontend-digest: ${{ steps.frontend-build.outputs.digest }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract backend metadata
      id: backend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
        tags: |
          type=ref,event=branch
          type=sha,prefix=staging-
          type=raw,value=staging-latest,enable={{is_default_branch}}

    - name: Extract frontend metadata
      id: frontend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix=staging-
          type=raw,value=staging-latest,enable={{is_default_branch}}

    - name: Prepare build context
      run: mkdir -p models

    - name: Build and push backend image
      id: backend-build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.backend
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.backend-meta.outputs.tags }}
        labels: ${{ steps.backend-meta.outputs.labels }}
        cache-from: type=gha,scope=backend-staging
        cache-to: type=gha,mode=max,scope=backend-staging
        build-args: |
          BUILDKIT_INLINE_CACHE=1
          BUILD_ENV=staging

    - name: Build and push frontend image
      id: frontend-build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.frontend
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.frontend-meta.outputs.tags }}
        labels: ${{ steps.frontend-meta.outputs.labels }}
        cache-from: type=gha,scope=frontend-staging
        cache-to: type=gha,mode=max,scope=frontend-staging
        build-args: |
          BUILDKIT_INLINE_CACHE=1
          VITE_APP_ENV=staging
          VITE_API_URL=https://api-staging.investment-analysis.com

    # metadata-action emits newline-separated tags; scanners/deploy need exactly one ref
    - name: Export primary image refs
      id: primary-images
      env:
        BACKEND_TAGS: ${{ steps.backend-meta.outputs.tags }}
        FRONTEND_TAGS: ${{ steps.frontend-meta.outputs.tags }}
      run: |
        set -euo pipefail
        pick_primary() {
          local tags="$1"
          local primary
          primary=$(printf '%s\n' "$tags" | grep -E ':staging-[0-9a-f]{7,40}$' | head -n1 || true)
          if [ -z "$primary" ]; then
            primary=$(printf '%s\n' "$tags" | grep -v 'staging-latest' | head -n1 || true)
          fi
          if [ -z "$primary" ]; then
            primary=$(printf '%s\n' "$tags" | head -n1 || true)
          fi
          if [ -z "$primary" ]; then
            echo "ERROR: no image tags available to select as primary" >&2
            exit 1
          fi
          # Collapse any residual whitespace/newlines into a single token
          printf '%s' "$primary" | tr -d '\r' | head -n1
        }
        backend_ref=$(pick_primary "$BACKEND_TAGS")
        frontend_ref=$(pick_primary "$FRONTEND_TAGS")
        echo "backend=$backend_ref" >> "$GITHUB_OUTPUT"
        echo "frontend=$frontend_ref" >> "$GITHUB_OUTPUT"
        echo "Primary backend image: $backend_ref"
        echo "Primary frontend image: $frontend_ref"

    # SBOM is best-effort: external Syft download can 504 and must not fail image publish
    - name: Generate SBOM for backend
      id: sbom-backend
      continue-on-error: true
      uses: anchore/sbom-action@v0
      with:
        image: ${{ steps.primary-images.outputs.backend }}
        output-file: backend-sbom.spdx.json
        format: spdx-json

    - name: Generate SBOM for frontend
      id: sbom-frontend
      continue-on-error: true
      uses: anchore/sbom-action@v0
      with:
        image: ${{ steps.primary-images.outputs.frontend }}
        output-file: frontend-sbom.spdx.json
        format: spdx-json

    - name: Upload SBOMs
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: sbom-reports
        path: |
          backend-sbom.spdx.json
          frontend-sbom.spdx.json
        if-no-files-found: ignore

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: [build-images]
    permissions:
      contents: read
      packages: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Trivy vulnerability scanner on backend
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        # Must be a single image reference (not newline-separated multi-tags)
        image-ref: ${{ needs.build-images.outputs.backend-image }}
        format: 'sarif'
        output: 'backend-trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'

    - name: Run Trivy vulnerability scanner on frontend
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ needs.build-images.outputs.frontend-image }}
        format: 'sarif'
        output: 'frontend-trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'

    # CodeQL Action v2 is deprecated; upload one SARIF per step (v3 rejects multi-path lists)
    - name: Upload backend Trivy SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('backend-trivy-results.sarif') != ''
      with:
        sarif_file: backend-trivy-results.sarif
        category: trivy-backend-staging

    - name: Upload frontend Trivy SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('frontend-trivy-results.sarif') != ''
      with:
        sarif_file: frontend-trivy-results.sarif
        category: trivy-frontend-staging

    - name: Check for critical vulnerabilities
      run: |
        set -euo pipefail
        # Trivy SARIF maps CRITICAL+HIGH to level=error; this gate must count CRITICAL only
        # (CVSS security-severity >= 9.0), matching production-deploy's Severity==CRITICAL check.
        for f in backend-trivy-results.sarif frontend-trivy-results.sarif; do
          if [ ! -f "$f" ]; then
            echo "ERROR: missing SARIF report $f (Trivy scan did not produce output)"
            exit 1
          fi
        done

        count_critical() {
          jq '
            [
              .runs[]?.results[]?
              | select(
                  ((.properties["security-severity"] // "0") | tonumber) >= 9.0
                )
            ] | length
          ' "$1"
        }
        count_high_error() {
          jq '[.runs[]?.results[]? | select(.level == "error")] | length' "$1"
        }

        CRITICAL_BACKEND=$(count_critical backend-trivy-results.sarif)
        CRITICAL_FRONTEND=$(count_critical frontend-trivy-results.sarif)
        ERROR_BACKEND=$(count_high_error backend-trivy-results.sarif)
        ERROR_FRONTEND=$(count_high_error frontend-trivy-results.sarif)

        echo "Backend CRITICAL (CVSS>=9.0): $CRITICAL_BACKEND (SARIF error-level HIGH+CRITICAL: $ERROR_BACKEND)"
        echo "Frontend CRITICAL (CVSS>=9.0): $CRITICAL_FRONTEND (SARIF error-level HIGH+CRITICAL: $ERROR_FRONTEND)"

        if [ "$CRITICAL_BACKEND" -gt 0 ] || [ "$CRITICAL_FRONTEND" -gt 0 ]; then
          echo "❌ CRITICAL vulnerabilities found! Deployment blocked."
          exit 1
        else
          echo "✅ No CRITICAL vulnerabilities (CVSS>=9.0). HIGH findings may still appear in SARIF upload."
        fi

  # Deploy to staging environment
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-images, security-scan]
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # TODO: Add K8s manifests when ready for K8s deployment
    # The steps below use docker-compose based deployment via blue_green_deploy.sh
    # which is the existing deployment mechanism for this project.

    - name: Write environment file
      run: |
        cat > .env.staging << EOF
        DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
        REDIS_URL=${{ secrets.STAGING_REDIS_URL }}
        JWT_SECRET_KEY=${{ secrets.STAGING_JWT_SECRET }}
        ALPHA_VANTAGE_API_KEY=${{ secrets.ALPHA_VANTAGE_API_KEY }}
        FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
        POLYGON_API_KEY=${{ secrets.POLYGON_API_KEY }}
        NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}
        BACKEND_IMAGE=${{ needs.build-images.outputs.backend-image }}
        FRONTEND_IMAGE=${{ needs.build-images.outputs.frontend-image }}
        APP_ENV=staging
        EOF

    - name: Deploy to staging via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_SSH_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          set -euo pipefail

          cd /opt/investment-analysis-platform

          # Pull latest code
          git fetch origin main
          git reset --hard origin/main

          # Write environment file
          cat > .env << 'ENVEOF'
          DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL=${{ secrets.STAGING_REDIS_URL }}
          JWT_SECRET_KEY=${{ secrets.STAGING_JWT_SECRET }}
          ALPHA_VANTAGE_API_KEY=${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          POLYGON_API_KEY=${{ secrets.POLYGON_API_KEY }}
          NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}
          BACKEND_IMAGE=${{ needs.build-images.outputs.backend-image }}
          FRONTEND_IMAGE=${{ needs.build-images.outputs.frontend-image }}
          APP_ENV=staging
          ENVEOF

          # Pull updated images
          docker pull ${{ needs.build-images.outputs.backend-image }}
          docker pull ${{ needs.build-images.outputs.frontend-image }}

          # Run database migrations before switching traffic
          echo "Running database migrations..."
          docker run --rm \
            --env-file .env \
            ${{ needs.build-images.outputs.backend-image }} \
            alembic upgrade head

          # Deploy using blue-green script
          bash scripts/deployment/blue_green_deploy.sh \
            --environment staging \
            --version ${{ github.sha }} \
            --skip-backup

    - name: Verify staging deployment health
      run: |
        echo "Waiting for staging services to stabilize..."
        sleep 30

        # Basic health check against staging URL
        curl -f --retry 5 --retry-delay 10 \
          "${{ secrets.STAGING_API_URL }}/api/health" || exit 1

        echo "Staging deployment verified healthy"

  # Run smoke tests
  smoke-tests:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install test dependencies
      run: |
        pip install requests pytest pytest-html pytest-json-report

    - name: Wait for services to be ready
      run: |
        echo "Waiting for staging services to be ready..."
        sleep 60

    - name: Run health checks
      run: |
        # Basic health check
        curl -f "${{ secrets.STAGING_API_URL }}/api/health" || exit 1
        
        # Database health check
        curl -f "${{ secrets.STAGING_API_URL }}/api/health/db" || exit 1
        
        # Redis health check  
        curl -f "${{ secrets.STAGING_API_URL }}/api/health/cache" || exit 1

    - name: Run API smoke tests
      run: |
        # Run basic API tests
        pytest backend/tests/smoke/ -v \
          --html=smoke-test-report.html \
          --json-report --json-report-file=smoke-test-report.json \
          --tb=short
      env:
        API_BASE_URL: ${{ secrets.STAGING_API_URL }}
        TEST_USER_EMAIL: ${{ secrets.STAGING_TEST_USER_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.STAGING_TEST_USER_PASSWORD }}

    - name: Run frontend smoke tests
      run: |
        # Simple frontend health check
        curl -f "${{ secrets.STAGING_FRONTEND_URL }}" || exit 1
        
        # Check if main bundles are loading
        curl -f "${{ secrets.STAGING_FRONTEND_URL }}/static/js/main.*js" || echo "Warning: Main JS bundle check failed"

    - name: Upload smoke test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: smoke-test-results
        path: |
          smoke-test-report.html
          smoke-test-report.json

  # Performance testing
  performance-test:
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: github.event_name == 'push'  # Only run on push, not manual dispatch
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5  
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Locust
      run: pip install locust

    - name: Run load tests
      run: |
        locust -f backend/tests/performance/staging_load_test.py \
          --host=${{ secrets.STAGING_API_URL }} \
          --users=10 \
          --spawn-rate=2 \
          --run-time=5m \
          --html=performance-report.html \
          --csv=performance \
          --headless

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: |
          performance-report.html
          performance_stats.csv
          performance_failures.csv

  # Generate test coverage report
  coverage-report:
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download test artifacts from CI
      uses: actions/download-artifact@v4
      with:
        pattern: "*test-results*"
        merge-multiple: true

    - name: Generate consolidated coverage report
      run: |
        # Combine coverage reports if available
        mkdir -p coverage-combined
        
        echo "## Staging Deployment Coverage Report" > coverage-combined/README.md
        echo "" >> coverage-combined/README.md
        echo "- **Backend Coverage**: Available in backend test artifacts" >> coverage-combined/README.md
        echo "- **Frontend Coverage**: Available in frontend test artifacts" >> coverage-combined/README.md
        echo "- **Smoke Tests**: Passed basic API and frontend checks" >> coverage-combined/README.md

    - name: Upload consolidated coverage
      uses: actions/upload-artifact@v4
      with:
        name: staging-coverage-report
        path: coverage-combined/

  # Notification and summary
  deployment-summary:
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-tests, performance-test, coverage-report]
    if: always()
    
    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        custom_payload: |
          {
            attachments: [{
              color: '${{ needs.deploy-staging.result }}' === 'success' ? 'good' : 'danger',
              title: 'Staging Deployment Summary',
              fields: [{
                title: 'Repository',
                value: '${{ github.repository }}',
                short: true
              }, {
                title: 'Branch',
                value: '${{ github.ref_name }}',
                short: true
              }, {
                title: 'Commit',
                value: '${{ github.sha }}',
                short: true
              }, {
                title: 'Environment',
                value: 'Staging',
                short: true
              }, {
                title: 'Deployment',
                value: '${{ needs.deploy-staging.result }}',
                short: true
              }, {
                title: 'Smoke Tests',
                value: '${{ needs.smoke-tests.result }}',
                short: true
              }, {
                title: 'Performance Tests',
                value: '${{ needs.performance-test.result }}',
                short: true
              }],
              footer: 'GitHub Actions',
              ts: Math.floor(Date.now() / 1000)
            }]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Create deployment summary
      run: |
        echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Build Images | ${{ needs.build-images.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Deployment | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY  
        echo "| Performance Tests | ${{ needs.performance-test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Staging URL**: ${{ secrets.STAGING_FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
        echo "**API URL**: ${{ secrets.STAGING_API_URL }}" >> $GITHUB_STEP_SUMMARY

    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **Staging Deployment Complete**
            
            ✅ **Deployment Status**: ${{ needs.deploy-staging.result }}
            ✅ **Smoke Tests**: ${{ needs.smoke-tests.result }}  
            ✅ **Performance Tests**: ${{ needs.performance-test.result }}
            
            **Preview URLs:**
            - Frontend: ${{ secrets.STAGING_FRONTEND_URL }}
            - API: ${{ secrets.STAGING_API_URL }}
            
            📊 Check the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for detailed results.`
          })

  # Rollback capability
  rollback:
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-staging.result == 'failure'
    needs: [deploy-staging]
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # TODO: Add K8s manifests when ready for K8s deployment
    # Rollback uses docker-compose blue-green script to restore prior environment.

    - name: Rollback to previous version via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_SSH_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          set -euo pipefail
          cd /opt/investment-analysis-platform

          echo "Initiating rollback on staging..."
          bash scripts/deployment/rollback.sh --environment staging

          # Verify health after rollback
          sleep 20
          curl -f "${{ secrets.STAGING_API_URL }}/api/health" || \
            echo "WARNING: Health check failed after rollback - manual intervention may be needed"

    - name: Notify rollback
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: |
          Staging Deployment Rolled Back

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          The deployment failed and has been automatically rolled back to the previous version.
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}