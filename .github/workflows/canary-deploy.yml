# Canary deployment with health-check auto-rollback (#101 / Wave 12)
name: Canary Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to canary (sha or semver)"
        required: true
        type: string
      canary_percent:
        description: "Traffic percentage for canary (1-50)"
        required: false
        default: "10"
        type: string
      health_url:
        description: "Health check URL for canary (no default — F8-14-011)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production

# F8-14-002: default the workflow token to read-only; jobs that
# write are granted narrow scopes at job level.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: canary-deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-canary:
    name: Deploy canary slice
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    outputs:
      canary_ref: ${{ steps.meta.outputs.ref }}
    steps:
      # F8-14-011: with the old example.com default, every default-input
      # dispatch probed a reserved domain five times and rolled back. Fail
      # at input validation instead, with an actionable message.
      - name: Validate health_url input
        env:
          HEALTH_URL: ${{ github.event.inputs.health_url }}
        run: |
          case "$HEALTH_URL" in
            ""|*example.com*)
              echo "ERROR: health_url is '$HEALTH_URL' — supply the real canary health endpoint (example.com is a reserved placeholder)."
              exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      # F8-14-005: inputs reach the shell only via env (never YAML-rendered
      # into run text), and the manifest is built with jq so no input can
      # break the JSON or the surrounding shell.
      - name: Resolve canary ref
        id: meta
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          CANARY_PERCENT: ${{ github.event.inputs.canary_percent }}
        run: |
          echo "ref=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "percent=$CANARY_PERCENT" >> "$GITHUB_OUTPUT"
          echo "Canary tag=$IMAGE_TAG at ${CANARY_PERCENT}% traffic"

      - name: Record canary deployment intent
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          CANARY_PERCENT: ${{ github.event.inputs.canary_percent }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
          HEALTH_URL: ${{ github.event.inputs.health_url }}
        run: |
          mkdir -p artifacts
          jq -n \
            --arg image_tag "$IMAGE_TAG" \
            --arg canary_percent "$CANARY_PERCENT" \
            --arg environment "$TARGET_ENV" \
            --arg health_url "$HEALTH_URL" \
            --arg started_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{image_tag: $image_tag,
              canary_percent: ($canary_percent | tonumber),
              environment: $environment,
              health_url: $health_url,
              started_at: $started_at}' > artifacts/canary-manifest.json
          cat artifacts/canary-manifest.json

      # Placeholder for real orchestrator (K8s/ECS/Nomad). Keeps workflow green
      # without requiring cloud credentials in CI.
      - name: Apply canary (dry-run when no deploy credentials)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # F8-14-013: the former dry_run GITHUB_ENV writes were read by
          # nothing (and job env cannot cross jobs); promote/rollback derive
          # credential presence from DEPLOY_TOKEN directly.
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "No DEPLOY_TOKEN secret — recording dry-run canary only."
          else
            echo "DEPLOY_TOKEN present — invoke external canary apply here."
            # Example: kubectl set image / aws ecs update-service ...
          fi

      - name: Upload canary manifest
        uses: actions/upload-artifact@v4
        with:
          name: canary-manifest
          path: artifacts/canary-manifest.json

  health-gate:
    name: Canary health gate
    runs-on: ubuntu-latest
    needs: [deploy-canary]
    steps:
      - name: Probe canary health
        id: health
        env:
          HEALTH_URL: ${{ github.event.inputs.health_url }}
        run: |
          set +e
          OK=0
          for i in 1 2 3 4 5; do
            echo "Health attempt $i → $HEALTH_URL"
            CODE=$(curl -sS -o /tmp/health_body -w "%{http_code}" --max-time 15 "$HEALTH_URL" || echo "000")
            echo "HTTP $CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "204" ]; then
              OK=1
              break
            fi
            sleep 10
          done
          if [ "$OK" = "1" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "✅ Canary health checks passed"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "❌ Canary health checks failed"
          fi

      - name: Fail job if unhealthy
        if: steps.health.outputs.healthy != 'true'
        run: |
          echo "Canary unhealthy — triggering rollback job"
          exit 1

  promote-or-rollback:
    name: Promote or auto-rollback
    runs-on: ubuntu-latest
    needs: [deploy-canary, health-gate]
    if: always()
    steps:
      - name: Decide action
        run: |
          HEALTH="${{ needs.health-gate.result }}"
          if [ "$HEALTH" = "success" ]; then
            echo "action=promote" >> "$GITHUB_ENV"
            echo "✅ Promoting canary to full traffic (or mark ready for promote)"
          else
            echo "action=rollback" >> "$GITHUB_ENV"
            echo "↩️ Auto-rollback: restore previous stable deployment"
          fi

      - name: Execute rollback (dry-run without credentials)
        if: env.action == 'rollback'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Rollback dry-run recorded (no DEPLOY_TOKEN)."
          else
            echo "Invoke platform rollback with DEPLOY_TOKEN (kubectl/ecs/etc)."
          fi
          # Surface failure so the workflow overall fails on bad canary
          exit 1

      - name: Execute promote (dry-run without credentials)
        if: env.action == 'promote'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Promote dry-run recorded (no DEPLOY_TOKEN)."
          else
            echo "Invoke platform promote with DEPLOY_TOKEN."
          fi
