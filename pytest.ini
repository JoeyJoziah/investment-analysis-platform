[pytest]
# Pytest Configuration for Investment Analysis App

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = backend/tests tests
norecursedirs = scripts .venv node_modules .git .tox .eggs frontend infrastructure data_pipelines ml_models .claude

# Minimum Python version
minversion = 3.9

# Add options
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10
    --maxfail=5
    -p no:cacheprovider
# Canonical coverage gate (audit 2026-04, F-15-009 / F-15-019 / F-15-027):
# 85% is the single enforced threshold. The 95% / 100% / 90% values quoted in
# backend/tests/README.md are aspirational targets, not gated. Pass coverage
# flags on the command line or in CI -- not auto-injected here so unit-test
# runs without --cov stay fast.
#   pytest backend/tests/ --cov=backend --cov-report=term-missing \
#                         --cov-report=xml:coverage.xml --cov-fail-under=85

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    security: Security tests
    compliance: Compliance tests
    financial: Financial model tests
    slow: Slow running tests (skip in CI by default)
    api: API endpoint tests
    database: Database tests
    cache: Cache-related tests
    external_api: Tests requiring external APIs
    flaky: Flaky tests that may need retries
    monitoring: Monitoring and metrics tests
    async_ops: Async operation tests
    data_quality: Data quality tests
    error_handling: Error handling tests

# Filtering
filterwarnings =
    default
    ignore::UserWarning
    ignore::DeprecationWarning:pandas.*
    ignore::PendingDeprecationWarning
    ignore:.*inspect.getargspec.*:DeprecationWarning
    ignore:.*distutils.*:DeprecationWarning
    ignore::DeprecationWarning:pydantic.*
    ignore::pydantic.warnings.PydanticDeprecatedSince20

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = backend
omit = 
    backend/tests/*
    backend/migrations/*
    backend/config/settings.py
    backend/*/__pycache__/*
    backend/*/conftest.py
    */venv/*
    */env/*
    */.venv/*
    */site-packages/*

branch = true
parallel = true

[coverage:report]
# Regexes for lines to exclude from consideration
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\b.*\):
    @(abc\.)?abstractmethod

ignore_errors = true
show_missing = true
precision = 2
skip_covered = false
skip_empty = false

[coverage:html]
directory = htmlcov
title = Investment Analysis App Coverage Report

[coverage:xml]
output = coverage.xml