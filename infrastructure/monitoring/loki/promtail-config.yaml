# Promtail Configuration - Ships logs to Loki
# Collects application logs and Docker container logs

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: investment-platform

scrape_configs:
  # Application logs (backend, celery, cost_monitor)
  - job_name: application
    static_configs:
      - targets:
          - localhost
        labels:
          job: investment-app
          environment: production
          __path__: /var/log/app/*.log

  # Backend API structured logs
  - job_name: backend-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend-api
          component: api
          __path__: /var/log/app/api*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            method: method
            path: path
            status: status_code
            duration: duration
      - labels:
          level:
          method:

  # Celery worker logs
  - job_name: celery-workers
    static_configs:
      - targets:
          - localhost
        labels:
          job: celery
          component: worker
          __path__: /var/log/app/celery*.log
    pipeline_stages:
      - regex:
          expression: '^\[(?P<timestamp>[^\]]+)\] \[(?P<level>\w+)/(?P<process>\w+)\]'
      - labels:
          level:

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/host/syslog
