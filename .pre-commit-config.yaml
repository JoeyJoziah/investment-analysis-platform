repos:
  # F8-14-008: mypy removed from pre-commit. pre-commit has no
  # failure-tolerance mechanism, so the former hook's "allow failures"
  # comment was inert — with a 3,636-error baseline it blocked every
  # backend commit, and its stub meta-package dependency cannot resolve.
  # Type gating runs in CI via .github/workflows/type-check.yml, which
  # carries the differential baseline logic (fail on NEW errors only).

  # Code formatting with black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [--line-length=120]
        files: ^backend/.*\.py$

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]
        files: ^backend/.*\.py$

  # Linting with flake8
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - --max-line-length=120
          - --extend-ignore=E203,W503,E501
          - --exclude=.venv,__pycache__,migrations
        files: ^backend/.*\.py$

  # Security checking with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-ll, -r, backend/, --skip=B608,B101]
        pass_filenames: false

  # Check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package.lock.json

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  # Python-specific checks
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-eval
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

# Configuration
default_language_version:
  python: python3.12

# Global settings
fail_fast: false  # Continue running all hooks even if one fails
