# Test Docker Compose Configuration
# Investment Analysis Platform - Testing Stack
# Usage: docker-compose -f docker-compose.yml -f docker-compose.test.yml up --abort-on-container-exit


services:
  # Test database with minimal resources
  postgres:
    environment:
      POSTGRES_DB: test_investment_db
      POSTGRES_PASSWORD: test_password
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    command: 
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB

  # Test Redis with minimal config
  redis:
    command: redis-server --requirepass test_password --maxmemory 256mb

  # Backend for testing
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
      target: test
    environment:
      - DATABASE_URL=postgresql://postgres:test_password@postgres:5432/test_investment_db
      - REDIS_URL=redis://:test_password@redis:6379/0
      - TESTING=true
      - DEBUG=false
      - LOG_LEVEL=WARNING
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "
        # Wait for services
        while ! nc -z postgres 5432; do sleep 1; done;
        while ! nc -z redis 6379; do sleep 1; done;
        # Run migrations
        alembic upgrade head;
        # Real suite lives under backend/tests (pyproject testpaths)
        pytest backend/tests -v --cov=backend --cov-report=html --cov-report=term-missing --junit-xml=test-results.xml
      "

  # F8-13-008: the former frontend test service requested a nonexistent
  # build target and mounted source over an nginx image with no npm;
  # frontend unit tests run in the CI frontend job instead.

volumes:
  postgres_test_data: