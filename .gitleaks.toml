# GitLeaks Configuration for Investment Analysis App

title = "Investment Analysis App Secret Detection"

# F8-08-003: extend the default ruleset instead of replacing it. Without
# this block, gitleaks v8 runs ONLY the custom rules below — no
# generic-api-key, high-entropy or private-key detection at all, which is
# the mechanical reason the 2026-08 audit's hand-found credentials were
# never flagged by CI.
[extend]
useDefault = true

# Custom rules for financial data APIs and services
[[rules]]
id = "alpha-vantage-api-key"
description = "Alpha Vantage API Key"
regex = '''(?i)(alpha[_-]?vantage[_-]?api[_-]?key|av[_-]?api[_-]?key)['"\s]*[:=]\s*['"]?([A-Z0-9]{16,32})['"]?'''
secretGroup = 2

[[rules]]
id = "finnhub-api-key"
description = "Finnhub API Key"
regex = '''(?i)(finnhub[_-]?api[_-]?key|fh[_-]?api[_-]?key)['"\s]*[:=]\s*['"]?([a-z0-9]{20,40})['"]?'''
secretGroup = 2

[[rules]]
id = "polygon-api-key"
description = "Polygon.io API Key"
regex = '''(?i)(polygon[_-]?api[_-]?key|poly[_-]?api[_-]?key)['"\s]*[:=]\s*['"]?([A-Za-z0-9_]{32,64})['"]?'''
secretGroup = 2

[[rules]]
id = "news-api-key"
description = "NewsAPI Key"
regex = '''(?i)(news[_-]?api[_-]?key|newsapi[_-]?key)['"\s]*[:=]\s*['"]?([a-f0-9]{32})['"]?'''
secretGroup = 2

# F8-08-003: the four leaked vendor keys (F8-16-001) that previously had
# no matching rule.
[[rules]]
id = "fmp-api-key"
description = "Financial Modeling Prep API Key"
regex = '''(?i)(fmp[_-]?api[_-]?key)['"\s]*[:=]\s*['"]?([A-Za-z0-9]{20,64})['"]?'''
secretGroup = 2

[[rules]]
id = "marketaux-api-key"
description = "Marketaux API Key"
regex = '''(?i)(marketaux[_-]?api[_-]?key)['"\s]*[:=]\s*['"]?([A-Za-z0-9]{16,64})['"]?'''
secretGroup = 2

[[rules]]
id = "fred-api-key"
description = "FRED API Key"
regex = '''(?i)(fred[_-]?api[_-]?key)['"\s]*[:=]\s*['"]?([a-f0-9]{16,64})['"]?'''
secretGroup = 2

[[rules]]
id = "openweather-api-key"
description = "OpenWeather API Key"
regex = '''(?i)(openweather[_-]?(?:map[_-]?)?api[_-]?key)['"\s]*[:=]\s*['"]?([a-f0-9]{16,64})['"]?'''
secretGroup = 2

[[rules]]
id = "database-url-password"
description = "Database URL with Password"
regex = '''postgresql://[^:]*:([^@\s]+)@[^/\s]*/[^\s]*'''
secretGroup = 1

[[rules]]
id = "redis-url-password"  
description = "Redis URL with Password"
regex = '''redis://[^:]*:([^@\s]+)@[^/\s]*'''
secretGroup = 1

[[rules]]
id = "jwt-secret-key"
description = "JWT Secret Key"
regex = '''(?i)(jwt[_-]?secret[_-]?key|jwt[_-]?key)['"\s]*[:=]\s*['"]?([A-Za-z0-9+/=]{32,})['"]?'''
secretGroup = 2

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''(?i)(aws[_-]?access[_-]?key[_-]?id|access[_-]?key[_-]?id)['"\s]*[:=]\s*['"]?(AKIA[0-9A-Z]{16})['"]?'''
secretGroup = 2

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = '''(?i)(aws[_-]?secret[_-]?access[_-]?key|secret[_-]?access[_-]?key)['"\s]*[:=]\s*['"]?([A-Za-z0-9+/]{40})['"]?'''
secretGroup = 2

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''(?i)(github[_-]?token|gh[_-]?token)['"\s]*[:=]\s*['"]?(ghp_[A-Za-z0-9_]{36}|gho_[A-Za-z0-9_]{36}|ghu_[A-Za-z0-9_]{36}|ghs_[A-Za-z0-9_]{36}|ghr_[A-Za-z0-9_]{36})['"]?'''
secretGroup = 2

[[rules]]
id = "slack-webhook"
description = "Slack Webhook URL"
regex = '''https://hooks\.slack\.com/services/[A-Z0-9]{9}/[A-Z0-9]{9}/[A-Za-z0-9]{24}'''

[[rules]]
id = "docker-config-auth"
description = "Docker Config Auth"
regex = '''(?i)"auth"\s*:\s*"([A-Za-z0-9+/=]{20,})"'''
secretGroup = 1

[[rules]]
id = "kubernetes-bearer-token"
description = "Kubernetes Bearer Token"
regex = '''(?i)(bearer[_-]?token|authorization[_-]?bearer)['"\s]*[:=]\s*['"]?([A-Za-z0-9\-._~+/]+=*)['"]?'''
secretGroup = 2

# File path allowlists (files to ignore)
[allowlist]
description = "Allowlisted files"
# F8-08-003: the blanket test-file and markdown allowlist entries are
# gone — they suppressed scanning of exactly the files where real service
# creds (scripts/testing/test_all_passwords.py, scope 17) and
# credential-bearing docs (F-08-009) live. Genuine fixtures should use
# narrow path-specific allowlist entries instead.
#
# NOTE: gitleaks v8's path allowlist key is `paths` — the former separate
# `files` list was a v7-ism that v8 silently ignored, so everything in it
# was never actually allowlisted. All file patterns live in `paths` now.
paths = [
    '''(.*?)(jpg|gif|doc|pdf|bin|svg|socket)$''',
    '''(^|/)\.env\.example$''',
    '''(^|/)\.env\.template$''',
    '''package-lock\.json$''',
    '''yarn\.lock$''',
    # detect-secrets ledger: stores SHA1 hashes of secrets, never plaintext —
    # scanning it yields hundreds of generic-api-key false positives.
    # (^|/) so the match survives both git mode (relative paths) and
    # --no-git mode (absolute paths).
    '''(^|/)\.secrets\.baseline$''',
    '''node_modules/''',
    '''\.git/''',
    '''htmlcov/''',
    '''coverage/''',
    '''venv/''',
    '''\.venv/''',
    '''__pycache__/''',
    '''\.pytest_cache/''',
    '''logs/''',
    '''data/cache/''',
]

# Regex patterns to allowlist (reduce false positives)
regexes = [
    '''example\.com''',
    '''localhost''',
    '''127\.0\.0\.1''',
    '''0\.0\.0\.0''',
    '''test[_-]?password''',
    '''dummy[_-]?key''',
    '''placeholder''',
    '''template''',
    '''sample[_-]?token''',
    '''YOUR[_-]?API[_-]?KEY''',
    '''<API_KEY>''',
    '''\$\{[A-Z_]+\}''',  # Environment variable placeholders
]

# Commits to allowlist (if needed)
commits = [
    # "commitsha",
]

# Stopwords that indicate false positives.
#
# Audit fix 2026-04 / F-08-011: previously this list contained the exact
# keywords (password, bearer, token, api, key, secret, auth) that should
# *trigger* secret detection. Any line containing one of those strings
# was suppressed, including real leaks. Replaced with the documented
# placeholder pattern set commonly used by gitleaks consumers.
#
# Real fix: rely on per-rule entropy + regex specificity, and on the path
# allowlist above for fixtures/test files. Keep stopwords narrow.
stopwords = [
    '''example''',
    '''placeholder''',
    '''dummy''',
    '''sample''',
    '''xxxxxxxx''',
    '''00000000''',
]